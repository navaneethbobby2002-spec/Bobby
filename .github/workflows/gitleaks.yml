name: gitleaks-scan
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run gitleaks (repo policy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go (required by some gitleaks builds)
        uses: actions/setup-go@v4
        with:
          go-version: "1.20"

      - name: Run gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source=. --config=.gitleaks.toml --report-format=json --report-path=reports/gitleaks-report.json --baseline-path=gitleaks-baseline.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
